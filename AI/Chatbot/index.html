<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ShopBot - Customer Support</title>
  <link rel="stylesheet" href="css/style.css" />
</head>


<body>

  <div id="app">

    <!-- Header -->
    <div id="header">
      <h2>🛍️ ShopBot</h2>
      <p>Customer Support Assistant</p>
    </div>

    <!-- Chat Messages Area -->
    <div id="messages"></div>

    <!-- Quick Reply Buttons -->
    <div id="quick-btns">
      <button class="qbtn" onclick="sendMsg('Track my order')">📦 Track Order</button>
      <button class="qbtn" onclick="sendMsg('Return a product')">🔄 Returns</button>
      <button class="qbtn" onclick="sendMsg('Payment issue')">💳 Payment</button>
      <button class="qbtn" onclick="sendMsg('Shipping info')">🚚 Shipping</button>
      <button class="qbtn" onclick="sendMsg('Talk to human')">👤 Human Agent</button>
    </div>

    <!-- Input Row -->
    <div id="input-row">
      <input
        id="user-input"
        type="text"
        placeholder="Type your message here..."
        onkeydown="if(event.key === 'Enter') sendMsg()"
      />
      <button id="send-btn" onclick="sendMsg()">Send</button>
    </div>

  </div>

  <script src="js/rules.js"></script>
  <script src="js/chatbot.js"></script>

</body>

</html>
